<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>VM Mobile Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
<button id="menu-button" class="icon-button">☰</button>
<div class="topbar-title"><span id="connection-title">Desconectado</span><small id="connection-subtitle">Configura el servidor</small></div>
<div id="status-dot" class="status-dot"></div>
</header>
<main id="app">
<section id="connect-view" class="view active">
<div class="card">
<h1>Conectar a MeeterLink</h1>
<p>Introduce la IP local del PC donde corren Voicemeeter y MeeterLink.</p>
<label class="field"><span>IP o host</span><input id="server-host" placeholder="192.168.1.50"></label>
<label class="field"><span>Puerto</span><input id="server-port" value="8080"></label>
<button id="connect-button" class="primary-button">Conectar</button>
<p id="connect-error" class="error"></p>
</div>
</section>
<section id="scenes-view" class="view">
<div class="section-header"><h2>Escenas</h2><button id="add-scene" class="small-button">+ Capturar actual</button></div>
<div id="scene-list" class="scene-grid"></div>
<div class="card">
<h3>Editar escena</h3>
<label class="field"><span>Nombre</span><input id="scene-name" placeholder="Juego"></label>
<div id="scene-editor" class="scene-editor"></div>
<div class="row"><button id="save-scene" class="primary-button">Guardar</button><button id="delete-scene" class="danger-button">Eliminar</button></div>
</div>
</section>
<section id="mixer-view" class="view">
<div class="tabs"><button class="tab active" data-target="inputs">Entradas</button><button class="tab" data-target="outputs">Salidas</button></div>
<div id="inputs" class="channel-grid"></div>
<div id="outputs" class="channel-grid hidden"></div>
</section>
</main>
<script src="js/state.js"></script>
<script src="js/ws.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
